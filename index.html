<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>📊 Portfolio Tracker</h1>
    <button onclick="toggleDarkMode()">🌓</button>
  </header>

  <section class="controls">
    <button onclick="addRow()">➕ Add</button>
    <button onclick="recalculate()">🔄 Recalc</button>
    <button onclick="save()">💾 Save</button>
    <button onclick="exportCSV()">⬇️ Export</button>
    <input type="file" onchange="importCSV(event)" />
  </section>

  <section class="summary">
    <div id="invested">Invested: $0</div>
    <div id="value">Value: $0</div>
    <div id="gain" class="neutral">Gain/Loss: $0</div>
    <div id="monthly">Monthly: $0</div>
    <div id="shares">Shares: 0</div>
    <div id="best">Best: -</div>
    <div id="worst">Worst: -</div>
  </section>

<div class="table-wrapper">
  <table id="portfolioTable">
    <thead>
      <tr>
        <th>Type</th>
        <th>Ticker</th>
        <th>Quantity</th>
        <th>Purchase Price</th>
        <th>Current Price</th>
        <th>Sector</th>
        <th>Dividend</th>
        <th>Action</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

  <section class="charts">
    <canvas id="dividends"></canvas>
    <canvas id="holdings"></canvas>
    <canvas id="sectors"></canvas>
    <canvas id="monthlyChart"></canvas>
    <canvas id="allocations"></canvas>
  </section>

  <script src="app.js"></script>
</body>
</html>
